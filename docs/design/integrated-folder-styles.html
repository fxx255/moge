<div id="moge-folder-designs">
  <div class="viz-carousel viz-dotted-background" aria-label="原位展开的文件夹分组" data-previous-label="上一款" data-next-label="下一款">
    <section data-variant="纸质档案夹" aria-label="纸质档案夹"><div class="mf-stage"><div class="mf-phone mf-manila" data-theme="chalk"></div></div></section>
    <section data-variant="索引档案夹" aria-label="索引档案夹" hidden><div class="mf-stage"><div class="mf-phone mf-index" data-theme="chalk"></div></div></section>
    <section data-variant="标签收纳袋" aria-label="标签收纳袋" hidden><div class="mf-stage"><div class="mf-phone mf-pocket" data-theme="chalk"></div></div></section>
  </div>
</div>
<style>
#moge-folder-designs .mf-stage { min-height: 670px; padding: 16px 8px 28px; display: grid; place-items: center; }
#moge-folder-designs .mf-phone {
  --mf-bg: light-dark(#f7f5ef,#1e2b26); --mf-grid: light-dark(#dde4ec,#2a3a33);
  --mf-ink: light-dark(#23262c,#ecede6); --mf-muted: light-dark(#636973,#b0bbb3);
  --mf-surface: light-dark(#fff,#24332d); --mf-inset: light-dark(#f1efe8,#203029);
  --mf-outline: light-dark(#d5d9db,#3b4c43); --mf-accent: light-dark(#244588,#f2d675);
  --mf-folder: light-dark(#e7ddbc,#6a6546); --mf-folder-front: light-dark(#f3e8c7,#80774a);
  --mf-folder-ink: light-dark(#3e3a2c,#fff6d3); --mf-highlight: light-dark(#dfe8f7,#4a4320);
  width: min(100%,386px); height: 604px; border-radius: 22px; overflow: hidden;
  font: 400 14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif; color: var(--mf-ink);
  background-color: var(--mf-bg); background-image: linear-gradient(var(--mf-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mf-grid) 1px,transparent 1px); background-size: 24px 24px;
  border: 1px solid var(--mf-outline); display: flex; flex-direction: column;
}
#moge-folder-designs .mf-phone[data-theme="chalk"] { color-scheme: dark; }
#moge-folder-designs .mf-phone[data-theme="paper"] { color-scheme: light; }
#moge-folder-designs .mf-phone * { box-sizing: border-box; }
#moge-folder-designs .mf-chrome { display: flex; gap: 8px; align-items: center; padding: 20px 16px 14px; flex: 0 0 68px; }
#moge-folder-designs .mf-chrome strong { font: 400 24px/1.4 "SimSun",serif; margin-right: auto; position: relative; }
#moge-folder-designs .mf-chrome strong::after { content: ""; position: absolute; bottom: 1px; left: -2px; right: -2px; height: 11px; background: var(--mf-accent); opacity: .3; }
#moge-folder-designs .mf-chrome i { display: block; width: 22px; height: 22px; }
#moge-folder-designs .mf-main { min-height: 0; flex: 1; display: flex; flex-direction: column; }
#moge-folder-designs .mf-header { margin: 4px 16px 0; border: 1px solid var(--mf-outline); border-radius: 17px; background: var(--mf-surface); padding: 7px; flex: 0 0 auto; box-shadow: 0 3px 8px #00000012; }
#moge-folder-designs .mf-search { min-height: 54px; display: flex; gap: 12px; align-items: center; background: var(--mf-inset); border-radius: 11px; padding: 8px 13px; }
#moge-folder-designs .mf-search i { width: 21px; height: 21px; color: var(--mf-muted); }
#moge-folder-designs .mf-search input { background: transparent; color: var(--mf-ink); border: 0; width: 100%; min-width: 0; font: inherit; }
#moge-folder-designs .mf-search input::placeholder { color: var(--mf-muted); opacity: 1; }
#moge-folder-designs .mf-tabs { min-height: 49px; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
#moge-folder-designs .mf-tab { color: var(--mf-muted); padding: 8px 10px; border: 0; background: transparent; white-space: nowrap; border-radius: 8px; font: inherit; }
#moge-folder-designs .mf-tab[aria-pressed="true"] { color: var(--mf-accent); background: var(--mf-highlight); }
#moge-folder-designs .mf-drop-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: transparent; color: var(--mf-muted); font: inherit; padding: 7px 9px 10px; min-height: 40px; }
#moge-folder-designs .mf-drop-toggle i { width: 17px; height: 17px; }
#moge-folder-designs .mf-folders { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; max-height: 250px; overflow-y: auto; padding: 5px 5px 12px; }
#moge-folder-designs .mf-folders[hidden] { display: none; }
#moge-folder-designs .mf-folder { position: relative; min-height: 86px; margin-top: 11px; background: var(--mf-folder); border: 0; border-radius: 2px 8px 8px 8px; color: var(--mf-folder-ink); font: inherit; text-align: left; padding: 22px 13px 12px; display: flex; align-items: center; gap: 8px; }
#moge-folder-designs .mf-folder::before { content: ""; position: absolute; left: 0; top: -11px; width: 45%; height: 18px; background: var(--mf-folder); border-radius: 6px 9px 0 0; }
#moge-folder-designs .mf-folder::after { content: ""; position: absolute; inset: 10px 0 0; border-radius: 7px; background: var(--mf-folder-front); }
#moge-folder-designs .mf-folder span,#moge-folder-designs .mf-folder i { position: relative; z-index: 1; }
#moge-folder-designs .mf-folder span { overflow-wrap: anywhere; }
#moge-folder-designs .mf-folder i { width: 19px; height: 19px; flex: 0 0 19px; }
#moge-folder-designs .mf-folder[aria-pressed="true"] { outline: 2px solid var(--mf-accent); outline-offset: 2px; }
#moge-folder-designs .mf-index .mf-folder { min-height: 82px; border-radius: 7px; background: var(--mf-inset); color: var(--mf-ink); margin-top: 0; padding: 16px 13px 16px 28px; }
#moge-folder-designs .mf-index .mf-folder::before { top: 11px; left: 0; height: calc(100% - 22px); width: 10px; border-radius: 0 6px 6px 0; background: var(--mf-accent); opacity: .65; }
#moge-folder-designs .mf-index .mf-folder::after { inset: 4px 3px 0 17px; border-radius: 5px; border-top: 2px solid var(--mf-outline); background: transparent; }
#moge-folder-designs .mf-index .mf-folders { gap: 10px; padding-top: 2px; }
#moge-folder-designs .mf-pocket .mf-folder { background: var(--mf-inset); border-radius: 8px; margin-top: 9px; padding-top: 23px; min-height: 95px; color: var(--mf-ink); }
#moge-folder-designs .mf-pocket .mf-folder::before { left: 10px; right: 10px; top: -8px; width: auto; height: 26px; border-radius: 4px; background: var(--mf-folder); border-top: 4px solid var(--mf-folder-front); }
#moge-folder-designs .mf-pocket .mf-folder::after { inset: 20px 0 0; border-radius: 3px 3px 8px 8px; background: var(--mf-surface); border-top: 1px solid var(--mf-outline); }
#moge-folder-designs .mf-pocket .mf-folder span { background: var(--mf-highlight); padding: 2px 7px; border-radius: 3px; }
#moge-folder-designs .mf-content { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 16px 30px; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-content: start; align-items: start; gap: 12px; }
#moge-folder-designs .mf-note { min-width: 0; position: relative; padding: 23px 12px 16px; background: var(--mf-surface); border-radius: 8px 8px 0 0; min-height: 145px; }
#moge-folder-designs .mf-note::before { content: ""; position: absolute; top: 7px; right: 9px; height: 11px; width: 45px; background: var(--mf-folder); opacity: .7; transform: rotate(6deg); }
#moge-folder-designs .mf-note b { display: block; font-weight: 500; margin-bottom: 8px; }
#moge-folder-designs .mf-note small { color: var(--mf-muted); font-size: 12px; }
@media (prefers-reduced-motion:no-preference) { #moge-folder-designs .mf-header { transition: padding .18s ease; } }
</style>
<script>
(() => {
  const root = document.getElementById('moge-folder-designs');
  const state = { theme: 'chalk', stage: '展开' };
  const names = ['未分类','高数','通信原理','英语'];
  const phones = [...root.querySelectorAll('.mf-phone')];
  phones.forEach(phone => {
    phone.innerHTML = `<header class="mf-chrome"><i data-lucide="arrow-left" aria-hidden="true"></i><strong>历史对话</strong><i data-lucide="book-open" aria-hidden="true"></i><i data-lucide="folder" aria-hidden="true"></i></header>
      <div class="mf-main"><div class="mf-header"><label class="mf-search"><i data-lucide="search" aria-hidden="true"></i><input type="search" aria-label="搜索对话" placeholder="搜索标题、消息或识别文本"></label>
      <nav class="mf-tabs" aria-label="分类筛选">${['全部',...names].map((name,i)=>`<button type="button" class="mf-tab cursor-interaction" aria-pressed="${i===0}">${name}</button>`).join('')}</nav>
      <button type="button" class="mf-drop-toggle cursor-interaction" aria-expanded="true"><span>松手放入分组</span><i data-lucide="chevron-up" aria-hidden="true"></i></button>
      <div class="mf-folders" aria-label="展开的分组">${names.map(name=>`<button type="button" class="mf-folder cursor-interaction" aria-pressed="false"><i data-lucide="folder-open" aria-hidden="true"></i><span>${name}</span></button>`).join('')}</div></div>
      <div class="mf-content" role="region" aria-label="对话卡片"><article class="mf-note"><b>64QAM 调制与解调</b><small>整理两路正交载波、匹配滤波与抽样判决。</small></article><article class="mf-note"><b>微积分错题整理</b><small>曲面积分与高斯公式的使用条件。</small></article><article class="mf-note"><b>量化与编码</b><small>量化电平、误差与 13 位线性编码。</small></article><article class="mf-note"><b>阅读练习</b><small>今日英语阅读与句子分析。</small></article></div></div>`;
    phone.querySelector('.mf-drop-toggle').addEventListener('click', () => {
      state.stage = state.stage === '展开' ? '拖动中' : '展开'; render();
    });
    phone.querySelectorAll('.mf-tab').forEach(button => button.addEventListener('click', () => {
      phone.querySelectorAll('.mf-tab').forEach(item => item.setAttribute('aria-pressed',String(item===button)));
    }));
    phone.querySelectorAll('.mf-folder').forEach(button => button.addEventListener('click', () => {
      phone.querySelectorAll('.mf-folder').forEach(item => item.setAttribute('aria-pressed',String(item===button)));
    }));
  });
  if (globalThis.lucide) lucide.createIcons({ attrs: { width: 19, height: 19 } });
  function render() {
    phones.forEach(phone => {
      phone.dataset.theme = state.theme;
      const toggle = phone.querySelector('.mf-drop-toggle');
      toggle.hidden = state.stage === '浏览';
      toggle.style.display = state.stage === '浏览' ? 'none' : '';
      toggle.setAttribute('aria-expanded',String(state.stage === '展开'));
      toggle.querySelector('span').textContent = state.stage === '展开' ? '松手放入分组' : '向上拖入分组，展开全部分组';
      phone.querySelector('.mf-folders').hidden = state.stage !== '展开';
    });
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSelect(state,'theme',{ label:'主题', options:[{label:'黑板',value:'chalk'},{label:'方格本',value:'paper'}] });
    tweak.addSelect(state,'stage',{ label:'展开状态', options:['浏览','拖动中','展开'] });
  }
})();
</script>
