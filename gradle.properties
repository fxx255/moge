# Build with JDK 21. Keep machine-specific JDK/SDK paths in user configuration.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dorg.gradle.kotlin.dsl.internal.io.timeout=600000
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# Install the SDK versions documented in README.md before building.
android.builder.sdkDownload=false

kotlin.code.style=official
ksp.incremental=true
